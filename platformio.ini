; Un entorno por main. Todos comparten los modulos de src/; cada uno compila
; solo su archivo de src/apps/. Elegir el entorno en la barra de PlatformIO.
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo

    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[platformio]
default_envs = pistaB

; Comandos por Serial para probar y calibrar (antes main.cpp)
[env:debug]
build_src_filter = +<*> -<apps/> +<apps/debug.cpp>

; Competencia: laberinto
[env:pistaA]
build_src_filter = +<*> -<apps/> +<apps/pistaA.cpp>

; Competencia: niveles (por ahora secciones 2 y 3)
[env:pistaB]
build_src_filter = +<*> -<apps/> +<apps/pistaB.cpp>

; Banco de vision: solo recibe del celular (CVSquirtDeAga) y lo muestra en el LCD,
; como el firmware 'uno' de ese repo. No mueve motores.
[env:vision]
build_src_filter = +<*> -<apps/> +<apps/vision.cpp>

; Banco del LCD: escanea I2C, ciclo de pruebas y texto por Serial. No mueve motores.
[env:pantalla]
build_src_filter = +<*> -<apps/> +<apps/pantalla.cpp>
